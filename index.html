<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 학원 매니저</title>
<meta name="description" content="두 자녀의 학원 일정, 픽업, 학원비와 카드 배분을 한 곳에서 관리하는 가족 앱">
<meta name="theme-color" content="#2b4a8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학원매니저">
<style>
:root{
  --bg:#f4f5f9; --paper:#fff; --ink:#1a2033; --muted:#646b80; --line:#e0e3ec;
  --brand:#2b4a8b; --brand-soft:#e7ecf7; --on-brand:#fff;
  --good:#2f7a52; --good-soft:#e3f2ea; --warn:#a8620b; --warn-soft:#fdf1df; --bad:#c23b2a; --bad-soft:#fbe6e3;
  --samsung:#1d4fc4; --shinhan:#0b8a8a;
  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10131d; --paper:#1a1e2b; --ink:#e9ebf2; --muted:#9aa1b6; --line:#2c3243;
  --brand:#8ea9ea; --brand-soft:#232c45; --on-brand:#10131d;
  --good:#6cc596; --good-soft:#1c3328; --warn:#f0b35a; --warn-soft:#3a2c17; --bad:#ef8576; --bad-soft:#3d211e;
  --samsung:#86a6f5; --shinhan:#5cd0cf; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
header.top h1{font-size:1.25rem;margin:0;font-weight:800;letter-spacing:-.02em}
.datenav{display:flex;align-items:center;gap:4px}
.datenav b{min-width:118px;text-align:center;font-size:.95rem}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:36px;height:36px;cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:.8rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.8rem;border-radius:8px}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.9rem;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.alert.good{background:var(--good-soft);color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .time{width:92px;flex:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.item .body{flex:1;min-width:0}
.item .title{font-weight:600}
.cancelled .title,.cancelled .time{text-decoration:line-through;color:var(--muted)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.b-extra{background:var(--good-soft);color:var(--good)}
.b-change{background:var(--warn-soft);color:var(--warn)}
.b-cancel{background:var(--bad-soft);color:var(--bad)}
.b-samsung{background:color-mix(in srgb,var(--samsung) 15%,transparent);color:var(--samsung)}
.b-shinhan{background:color-mix(in srgb,var(--shinhan) 15%,transparent);color:var(--shinhan)}
.b-plain{background:var(--brand-soft);color:var(--brand)}
.b-paid{background:var(--good-soft);color:var(--good)}
.b-due{background:var(--warn-soft);color:var(--warn)}
.b-late{background:var(--bad-soft);color:var(--bad)}
.pickup{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.pickup.need{border-color:var(--warn)}
.pickup.conflict{border-color:var(--bad)}
.pickup.done{opacity:.6}
.pickup select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--paper);max-width:140px}
.progress{height:12px;background:var(--brand-soft);border-radius:8px;overflow:hidden;margin:8px 0 4px;position:relative}
.progress i{display:block;height:100%;background:var(--samsung)}
.progress em{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--samsung) 35%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:.75rem;color:var(--muted)}
.week{display:grid;gap:8px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.day h3{margin:0 0 6px;font-size:.92rem;display:flex;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;background:var(--bg);border-radius:8px;padding:3px 8px;margin:2px 4px 2px 0}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.list .li .t{min-width:0}
.list .li .t div{overflow:hidden;text-overflow:ellipsis}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;cursor:pointer;color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
dialog{border:0;border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px));background:var(--paper);color:var(--ink);max-height:86vh}
dialog::backdrop{background:rgba(10,14,25,.45)}
dialog form{padding:16px;display:grid;gap:12px}
dialog h3{margin:0;font-size:1.05rem}
.field{display:grid;gap:4px}
.field>span{font-size:.8rem;color:var(--muted);font-weight:600}
.field input:not([type=checkbox]),.field select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);width:100%}
.field input[type=color]{padding:2px;height:40px}
.wds{display:flex;gap:4px;flex-wrap:wrap}
.wds label{border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:.88rem}
.wds input{display:none}
.wds label:has(input:checked){background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.check{display:flex;gap:8px;align-items:center}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.syncbadge{border:0;background:none;padding:0;margin-top:2px;font-size:.74rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px}
.syncbadge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.syncbadge.ok::before{background:var(--good)}
.syncbadge.busy::before{background:var(--warn)}
.syncbadge.bad::before{background:var(--bad)}
.code{font-size:1.6rem;font-weight:800;letter-spacing:.18em;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:10px;padding:10px 14px;text-align:center;margin:6px 0 10px}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);width:100%}
.stack{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.88rem;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="title">오늘</h1><button class="syncbadge" id="sync" data-act="gofamily"></button></div>
    <div class="datenav" id="datenav">
      <button class="icon-btn" data-act="prev" aria-label="이전">‹</button>
      <b id="datelabel"></b>
      <button class="icon-btn" data-act="next" aria-label="다음">›</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>오늘</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>주간</button>
  <button data-tab="fees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>학원비</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</div></nav>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
